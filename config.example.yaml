# db-migration 설정 예제
# 문자열 값 안에서 ${ENV_VAR} 로 환경변수를 참조할 수 있습니다.
#   ${VAR}         : 환경변수 값. 없으면 에러
#   ${VAR:-기본값}  : 환경변수가 없거나 비어 있으면 기본값 사용
# 환경변수는 셸에서 직접 설정하거나 .env 파일에 적으면 됩니다 (.env.example 참고).
# .env 는 이 설정 파일과 같은 폴더, 그 다음 현재 폴더 순으로 찾으며 --env-file 로 직접 지정할 수도 있습니다.

source:
  host: ${SOURCE_HOST:-localhost}
  port: ${SOURCE_PORT:-5432}
  user: ${SOURCE_USER:-postgres}
  password: ${SOURCE_PASSWORD}      # 기본값 없음: 환경변수가 반드시 있어야 함
  database: source_db
  schema: public                    # 생략하면 public

destination:
  host: ${DEST_HOST:-localhost}
  port: ${DEST_PORT:-5432}
  user: ${DEST_USER:-postgres}
  password: ${DEST_PASSWORD}
  database: target_db
  schema: public

# 개별 항목 대신 dsn 한 줄로 적어도 됩니다. 둘 다 있으면 개별 항목이 dsn 값을 덮어씁니다.
# destination:
#   dsn: postgresql://user:pass@host:5432/dbname
#   schema: public

# 기본 복사 모드: truncate | append | upsert
#   truncate : 복사 전에 대상 테이블을 비움 (선택된 truncate 테이블 전체를 한 번에 TRUNCATE)
#   append   : 기존 데이터 유지하고 추가
#   upsert   : PK(또는 unique 제약) 기준으로 INSERT ... ON CONFLICT DO UPDATE
mode: append

# true 면 소스 스키마의 모든 테이블을 복사 (exclude 제외).
# false 면 tables 에 나열된 테이블만 복사.
copy_all: false

# copy_all: true 일 때 제외할 테이블
exclude:
  - audit_log
  - schema_migrations

# 복사할 테이블 (copy_all: false) 또는 테이블별 override (copy_all: true)
tables:
  - users                       # 이름만 적으면 전체 복사
  - name: orders
    where: "created_at >= '2024-01-01'"   # 소스 테이블에 적용될 WHERE 절 (SQL 그대로)
    mode: upsert                          # 이 테이블만 모드 override
  - name: order_items
    where: "order_id IN (SELECT id FROM orders WHERE created_at >= '2024-01-01')"

# 수동 순서 지정 (선택). 여기 적힌 테이블이 이 순서대로 먼저 복사되고,
# 나머지는 FK 기준으로 자동 정렬됩니다. 순환 참조가 있을 때 사용하세요.
# order:
#   - users
#   - orders

# truncate 대상 테이블을 복사 대상이 아닌 다른 테이블이 FK 로 참조할 때
# 그 테이블까지 함께 비울지 여부. 기본 false (에러로 중단).
truncate_cascade: false

# 복사 중 대상 테이블의 사용자 트리거를 끌지 여부 (테이블 소유자 권한 필요)
disable_triggers: false

# 복사 후 serial/identity 시퀀스를 MAX 값에 맞춰 재설정
reset_sequences: true

# dry-run 에서 where 조건이 있는 테이블의 실제 행 수를 count 할지 여부
# (대용량 테이블에서 느릴 수 있으면 false)
count_rows_on_dry_run: true

# 복사 중 진행 상황(전송 행 수, 용량)을 출력하는 간격(초). 0 이면 출력하지 않음
progress_interval: 5

# 이 시간(초) 동안 데이터가 전혀 흐르지 않으면 연결을 끊고 해당 테이블을 실패 처리한 뒤,
# 다시 연결해서 다음 테이블을 진행. 0 이면 무제한 대기
stall_timeout: 300

# 연결 오류(끊김, stall_timeout 정지)로 실패했을 때 재접속 후 다시 시도하는 횟수. 0 이면 재시도 없음.
# SQL 오류(제약 위반 등)는 다시 해도 같으므로 재시도하지 않습니다.
retries: 3

# 전송 방식
#   stream : 소스 COPY TO 출력을 대상 COPY FROM 으로 바로 흘려보냄 (빠름, 기본값)
#   file   : 소스를 로컬 파일로 먼저 내려받은 뒤 그 파일을 대상으로 올림.
#            내려받기 / 올리기가 분리되어 있어 한쪽 연결이 끊겨도 그 단계만 다시 하면 되므로
#            소스→대상 직접 연결이 자주 끊기는 환경에서 느리더라도 안정적으로 진행됩니다.
transfer: stream

# file 전송에서 내려받은 파일을 둘 폴더. 생략하면 시스템 임시 폴더 아래 db-migration.
# 테이블 하나당 "<소스스키마>.<테이블>.copy" 파일이 생기므로 큰 테이블이면 디스크 여유를 확인하세요.
# spool_dir: ./spool

# file 전송에서 올리기가 끝난 파일을 지우지 않고 남길지 여부. 다음 실행에서 같은 파일이 있으면
# (컬럼과 where 가 같을 때) 다시 내려받지 않고 재사용합니다. 올리기가 실패한 파일은 이 값과 관계없이 남깁니다.
keep_spool_files: false
