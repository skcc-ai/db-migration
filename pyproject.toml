[project]
name = "db-migration"
version = "0.1.0"
description = "PostgreSQL 테이블 데이터 마이그레이션 CLI 도구"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[project.scripts]
db-migration = "db_migration.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db_migration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
